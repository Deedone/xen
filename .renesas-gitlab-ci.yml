variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: 1

  PIPELINE_MODE:
    value: "RELEASE+COVERAGE"
    options:
      - "RELEASE+COVERAGE"
      - "UBSAN"
      - "FUZZER"
      - "MINERVA"
      - "HW"
    description: "Which pipeline to run"

workflow:
  name: '$PIPELINE_MODE | $CI_COMMIT_REF_NAME | $CI_COMMIT_TITLE'
  rules:
    - when: always

stages:
  - build
  - test
  - trace
  - analyze

default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure

.standard-pipeline-rules: &standard_pipeline
  - if: '$PIPELINE_MODE == "RELEASE+COVERAGE" || $PIPELINE_MODE == null'

.ubsan-pipeline-rules: &ubsan_pipeline
  - if: '$PIPELINE_MODE == "UBSAN"'

.fuzzer-pipeline-rules: &fuzzer_pipeline
  - if: '$PIPELINE_MODE == "FUZZER"'

.minerva-pipeline-rules: &minerva_pipeline
  - if: '$PIPELINE_MODE == "MINERVA"'

.hw-pipeline-rules: &hw_pipeline
  - if: '$PIPELINE_MODE == "HW"'

include:
  - local: 'automation/renesas-gitlab-ci/common.yaml'
  - local: 'automation/renesas-gitlab-ci/standard/build.yaml'
    rules: *standard_pipeline
  - local: 'automation/renesas-gitlab-ci/standard/lldb.yaml'
    rules: *standard_pipeline
  - local: 'automation/renesas-gitlab-ci/standard/zephyr.yaml'
    rules: *standard_pipeline
  - local: 'automation/renesas-gitlab-ci/gen5.yaml'
    rules: *hw_pipeline
  - local: 'automation/renesas-gitlab-ci/standard/trace.yaml'
    rules: *standard_pipeline
  - local: 'automation/renesas-gitlab-ci/standard/analyze.yaml'
    rules: *standard_pipeline
  - local: 'automation/renesas-gitlab-ci/ubsan.yaml'
    rules: *ubsan_pipeline
  - local: 'automation/renesas-gitlab-ci/fuzzer.yaml'
    rules: *fuzzer_pipeline
  - local: 'automation/renesas-gitlab-ci/minerva.yaml'
    rules: *minerva_pipeline
