variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: 1

workflow:
  rules:
    - when: always

stages:
  - artifacts
  - build
  - test
  - trace

include:
  - local: 'automation/renesas-gitlab-ci/artifacts.yaml'
  - local: 'automation/renesas-gitlab-ci/build.yaml'
  - local: 'automation/renesas-gitlab-ci/test.yaml'
  - local: 'automation/renesas-gitlab-ci/trace.yaml'
