variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: 1

workflow:
  name: '$PIPELINE_NAME_PREFIX | $CI_COMMIT_REF_NAME | $CI_COMMIT_TITLE'
  rules:
    - if: '$RUN_UBSAN == "true"'
      variables:
        PIPELINE_NAME_PREFIX: "UBSAN"
    - if: '$RUN_COVERAGE == "true"'
      variables:
        PIPELINE_NAME_PREFIX: "COVERAGE"
    - if: '$RUN_FUZZER == "true"'
      variables:
        PIPELINE_NAME_PREFIX: "FUZZER"
    - if: '$RUN_MINERVA == "true"'
      variables:
        PIPELINE_NAME_PREFIX: "MINERVA"
    - when: always
      variables:
        PIPELINE_NAME_PREFIX: "RELEASE"

stages:
  - artifacts
  - build
  - test
  - trace
  - analyze

default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure

# A standard pipeline runs the normal artifacts/build/test/trace/analyze
# suite. FUZZER and MINERVA are EXCLUSIVE modes that replace it, so the
# normal suite runs only when no exclusive mode is selected. Add any future
# exclusive mode to this single line.
.standard-pipeline-rules: &standard_pipeline
  - if: '$RUN_FUZZER != "true" && $RUN_MINERVA != "true"'

include:
  # artifacts.yaml is shared: a MINERVA pipeline still needs the image and
  # xen-tools exports for the runtime jobs, so it is gated off for FUZZER
  # only, not for MINERVA. (FUZZER is self-contained and does not use it.)
  - local: 'automation/renesas-gitlab-ci/artifacts.yaml'
    rules:
      - if: '$RUN_FUZZER != "true"'
  - local: 'automation/renesas-gitlab-ci/build.yaml'
    rules: *standard_pipeline
  - local: 'automation/renesas-gitlab-ci/test.yaml'
    rules: *standard_pipeline
  - local: 'automation/renesas-gitlab-ci/trace.yaml'
    rules: *standard_pipeline
  - local: 'automation/renesas-gitlab-ci/analyze.yaml'
    rules: *standard_pipeline
  - local: 'automation/renesas-gitlab-ci/fuzzer.yaml'
    rules:
      - if: '$RUN_FUZZER == "true"'
  - local: 'automation/renesas-gitlab-ci/minerva.yaml'
    rules:
      - if: '$RUN_MINERVA == "true"'
