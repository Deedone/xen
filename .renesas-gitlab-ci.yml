variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: 1

workflow:
  name: '$PIPELINE_NAME_PREFIX | $CI_COMMIT_REF_NAME | $CI_COMMIT_TITLE'
  rules:
    - if: '$RUN_UBSAN == "true"'
      variables:
        PIPELINE_NAME_PREFIX: "UBSAN"
    - if: '$RUN_COVERAGE == "true"'
      variables:
        PIPELINE_NAME_PREFIX: "COVERAGE"
    - if: '$RUN_FUZZER == "true"'
      variables:
        PIPELINE_NAME_PREFIX: "FUZZER"
    - when: always
      variables:
        PIPELINE_NAME_PREFIX: "RELEASE"

stages:
  - artifacts
  - build
  - test
  - trace
  - analyze

default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure

include:
  - local: 'automation/renesas-gitlab-ci/artifacts.yaml'
    rules:
      - if: '$RUN_FUZZER != "true"'
  - local: 'automation/renesas-gitlab-ci/build.yaml'
    rules:
      - if: '$RUN_FUZZER != "true"'
  - local: 'automation/renesas-gitlab-ci/test.yaml'
    rules:
      - if: '$RUN_FUZZER != "true"'
  - local: 'automation/renesas-gitlab-ci/trace.yaml'
    rules:
      - if: '$RUN_FUZZER != "true"'
  - local: 'automation/renesas-gitlab-ci/analyze.yaml'
    rules:
      - if: '$RUN_FUZZER != "true"'
  - local: 'automation/renesas-gitlab-ci/fuzzer.yaml'
    rules:
      - if: '$RUN_FUZZER == "true"'

# Indirect-call reachability per-run artifact pipeline.
#
# Target Xen configuration is taken from CI environment variables; the
# defaults below are smoke-validation only and must not be treated as
# the only supported config. Each pipeline run generates a fresh
# expanded .config and fresh callgraph artifacts inside its own job
# workspace. Numbers in indirect-reachability/status.json are per-run
# artifact values; they are NOT committed constants.
#
# Runtime logs are optional. Absence yields STATIC_ONLY (a valid
# success state). COMPLETE requires a matching runtime workload that
# the operator has aligned to the same .config and source revision.
minerva-indirect-reachability:
  stage: build
  image: xentroops/xen_rel
  allow_failure: true
  when: manual
  tags:
    - arm64
  variables:
    XEN_DEFCONFIG: "arm64_defconfig"
    # Callgraph backend selector. gcc-ci (default) keeps the
    # existing GCC `.ci` path. llvm-ir consumes Clang/LLVM
    # textual IR from $LLVM_IR_DIR. normalized consumes a
    # prebuilt graph from $NORMALIZED_CALLGRAPH_DIR.
    MINERVA_CALLGRAPH_BACKEND: "gcc-ci"
    # LLVM IR generation (opt-in static-analysis side-build). When
    # MINERVA_CALLGRAPH_BACKEND is "llvm-ir" and the flag below is
    # truthy, the driver generates a `.ll` tree from this run's
    # expanded .config (analysis compile replay with $LLVM_CC) and
    # feeds it to llvm_ir_to_normalized.py. Default keeps the GCC
    # production path; the LLVM backend is never the default.
    MINERVA_GENERATE_LLVM_IR: "false"
    LLVM_CC: "clang"
    # Runtime workload (Option A: same-job runtime collection). When
    # MINERVA_RUNTIME_COMMAND is set, the driver runs it after the
    # static stages, parses the logs it produces under
    # MINERVA_RUNTIME_LOG_DIR, and compares them with the static
    # artifacts from the same config and SHA. Empty by default, so
    # the job stays STATIC_ONLY until a runtime workload is
    # configured. MINERVA_RUNTIME_REQUIRED=true makes a runtime
    # failure PARTIAL rather than a STATIC_ONLY downgrade.
    MINERVA_RUNTIME_COMMAND: ""
    MINERVA_RUNTIME_LOG_DIR: "indirect-reachability/runtime/logs"
    MINERVA_RUNTIME_REQUIRED: "false"
    MINERVA_RUNTIME_TIMEOUT: "600"
  script:
    - bash automation/renesas-scripts/minerva/run_indirect_ci.sh
  artifacts:
    when: always
    paths:
      - indirect-reachability/

# --- Separated producer/consumer cycle (Series 10) -------------------
#
# The corpus assurance workflow consumes SEPARATED static-analysis and
# runtime artifacts. These three jobs express that cycle:
#
#   minerva-static-analysis        once per config/backend/build ->
#                                  static-analysis/
#   minerva-runtime-qemu-arm64     a runtime test               ->
#                                  runtime-artifacts/<test>/
#   minerva-allocation-assurance-corpus  joins both              ->
#                                  corpus-analysis/
#
# The producers reuse the existing driver and repackage its output
# into the contract trees via package_artifacts.sh, so no previous
# job's behaviour changes. The static job does no runtime; the runtime
# job does no static callgraph build (it pulls the static tree from the
# static job for the comparator inputs and runs only the workload +
# parse). The corpus job rebuilds nothing.

# Static-analysis producer: run once per config/backend/build. Runs the
# static stages only (--no-runtime via empty MINERVA_RUNTIME_COMMAND)
# and emits static-analysis/.
minerva-static-analysis:
  stage: build
  image: xentroops/xen_rel
  allow_failure: true
  when: manual
  tags:
    - arm64
  variables:
    MINERVA_CALLGRAPH_BACKEND: "llvm-ir"
    MINERVA_GENERATE_LLVM_IR: "true"
    LLVM_CC: "clang"
    MINERVA_RUNTIME_COMMAND: ""        # static only; no runtime here
    MINERVA_INDIRECT_OUT: "indirect-reachability"
  script:
    - bash automation/renesas-scripts/minerva/run_indirect_ci.sh
    - bash automation/renesas-scripts/minerva/package_artifacts.sh
        static indirect-reachability static-analysis
  artifacts:
    when: always
    paths:
      - static-analysis/


# Corpus-level dynamic-allocation assurance aggregation (Series 10).
# Consumes the SEPARATED static-analysis and runtime artifacts produced
# by the jobs above (via needs:), joins them by manifest identity, runs
# or reuses runtime/static comparison for matched pairs, performs
# scenario analysis, ingests optional structural coverage evidence, and
# emits one bounded assurance verdict. It rebuilds no static callgraphs
# and re-runs no per-test static analysis. It also supports manifest
# mode (--manifest artifact-index.json).
minerva-allocation-assurance-corpus:
  stage: analyze
  image: xentroops/xen_rel
  allow_failure: true
  when: manual
  needs:
    - job: minerva-static-analysis
      artifacts: true
    - job: minerva-qemu-smoke-dom0-arm64-gcc
      artifacts: true
    - job: minerva-qemu-smoke-dom0-arm64-gcc-debug
      artifacts: true
    - job: minerva-qemu-smoke-dom0less-arm64-gcc
      artifacts: true
    - job: minerva-qemu-smoke-dom0less-arm64-gcc-debug
      artifacts: true
    - job: minerva-qemu-smoke-dom0less-arm64-gcc-debug-boot-cpupools
      artifacts: true
    - job: minerva-qemu-smoke-dom0less-arm64-gcc-debug-earlyprintk
      artifacts: true
    - job: minerva-qemu-smoke-dom0less-arm64-gcc-debug-gicv3
      artifacts: true
    - job: minerva-qemu-smoke-dom0less-arm64-gcc-debug-static-shared-mem
      artifacts: true
    - job: minerva-qemu-smoke-dom0less-arm64-gcc-debug-staticheap
      artifacts: true
    - job: minerva-qemu-smoke-dom0less-arm64-gcc-debug-staticmem
      artifacts: true
    - job: minerva-qemu-xtf-dom0-arm64-gcc-debug-hyp-domctl-cacheflush
      artifacts: true
    - job: minerva-qemu-xtf-dom0-arm64-gcc-debug-hyp-domctl-createdomain
      artifacts: true
    - job: minerva-qemu-xtf-dom0-arm64-gcc-debug-hyp-domctl-destroydomain
      artifacts: true
    - job: minerva-qemu-xtf-dom0-arm64-gcc-debug-hyp-domctl-get-paging-mempool-size
      artifacts: true
    - job: minerva-qemu-xtf-dom0-arm64-gcc-debug-hyp-domctl-getdomaininfo
      artifacts: true
    - job: minerva-qemu-xtf-dom0-arm64-gcc-debug-hyp-domctl-max-mem
      artifacts: true
    - job: minerva-qemu-xtf-dom0-arm64-gcc-debug-hyp-domctl-pausedomain
      artifacts: true
    - job: minerva-qemu-xtf-dom0-arm64-gcc-debug-hyp-domctl-set-paging-mempool-size
      artifacts: true
    - job: minerva-qemu-xtf-dom0-arm64-gcc-debug-hyp-domctl-unpausedomain
      artifacts: true
    - job: minerva-qemu-xtf-dom0-arm64-gcc-debug-hyp-sysctl-getdomaininfolist
      artifacts: true
    - job: minerva-qemu-xtf-dom0-arm64-gcc-debug-hyp-sysctl-physinfo
      artifacts: true
    - job: minerva-qemu-xtf-dom0-arm64-gcc-debug-hyp-xen-version
      artifacts: true
    - job: minerva-qemu-xtf-dom0-arm64-gcc-hyp-xen-version
      artifacts: true
    - job: minerva-qemu-xtf-dom0-arm64-hyp-sysctl-sched-rtds-cmdline
      artifacts: true
    - job: minerva-qemu-xtf-dom0-arm64-hyp-sysctl-sched-rtds-edf
      artifacts: true
    - job: minerva-qemu-xtf-dom0-arm64-hyp-sysctl-sched-rtds-extratime
      artifacts: true
  tags:
    - arm64
  variables:
    # When true, the job exits non-zero if the bounded assurance claim
    # is NOT_SUPPORTED. Off by default so the report is produced for
    # inspection without failing the pipeline.
    MINERVA_ASSURANCE_FAIL_ON_NOT_SUPPORTED: "false"
  script:
    - |
      args=(
        --static-root static-analysis/
        --runtime-root runtime-artifacts/
        --policy docs/minerva-analysis/assurance-policy.example.yaml
        --out-dir corpus-analysis/
      )
      if [ -d coverage-artifacts ]; then
        args+=( --coverage-root coverage-artifacts/ )
      fi
      if [ "${MINERVA_ASSURANCE_FAIL_ON_NOT_SUPPORTED}" = "true" ]; then
        args+=( --fail-on-not-supported )
      fi
      python3 automation/renesas-scripts/minerva/analyze_reachability_corpus.py "${args[@]}"
  artifacts:
    when: always
    paths:
      - corpus-analysis/
