.test-jobs-common:
  stage: test
  image: registry.gitlab.com/xen-project/xen/${CONTAINER}
  rules:
  - when: on_success

.arm64-test-needs: &arm64-test-needs
  - linux-6.6.86-arm64
  - alpine-3.18-arm64-rootfs
  - qemu-system-aarch64-6.0.0-arm64-export

.arm64-xtf-test-needs: &arm64-xtf-test-needs
  - alpine-3.18-gcc-arm64
  - qemu-system-aarch64-6.0.0-arm64-export
  - linux-6.6.86-arm64

.qemu-arm64:
  extends: .test-jobs-common
  variables:
    CONTAINER: debian:bookworm-arm64v8
    LOGFILE: qemu-smoke-arm64.log
  artifacts:
    paths:
      - smoke.serial
      - '*.log'
    when: always
  tags:
    - arm64

# Test jobs
qemu-smoke-dom0-arm64-gcc:
  extends: .qemu-arm64
  script:
    - ./automation/renesas-scripts/qemu-smoke-dom0-arm64.sh 2>&1 | tee ${LOGFILE}
  needs:
    - *arm64-test-needs
    - alpine-3.18-gcc-arm64

qemu-smoke-dom0-arm64-gcc-debug:
  extends: .qemu-arm64
  script:
