# Build the OpenFastTrace tool (oft.jar) and the trace.sh driver from the
# rec-fusa/openfasttrace repo, and pass them to oft-trace as artifacts.
oft-build:
  stage: trace
  image: maven:3.8.3-openjdk-17
  script:
    - mkdir -p binaries
    - git clone --depth 1 https://gitlab-ci-token:${CI_JOB_TOKEN}@gitpct.epam.com/rec-fusa/openfasttrace.git -b ${OFT_BRANCH:-rel-safety-staging}
    - cd openfasttrace/ && ./automation/build.sh
    - cd .. && cp ./openfasttrace/automation/trace.sh trace.sh && cp ./openfasttrace/binaries/oft.jar binaries/oft.jar
  artifacts:
    paths:
      - binaries/oft.jar
      - trace.sh
    when: always
  tags:
   - aws-arm64
  needs: []
  # Run on every standard pipeline. Skip the instrumented UBSAN/COVERAGE
  # variants - the trace is source-based and would be identical there.
  # Non-gating: a missing deploy token or build hiccup must not block the
  # pipeline (the trace report is informational, coverage is not enforced yet).
  allow_failure: true
  rules:
   - if: '$RUN_UBSAN == "true"'
     when: never
   - if: '$RUN_COVERAGE == "true"'
     when: never
   - when: on_success

# Run OpenFastTrace over the requirements/spec/test repos and expose the
# resulting report.html on the pipeline and merge request.
oft-trace:
  stage: trace
  image: maven:3.8.3-openjdk-17
  script:
    - ./trace.sh 2>&1 | tee trace.log
  artifacts:
    paths:
      - report.html
      - trace.log
    when: always
  tags:
   - aws-arm64
  needs:
    - oft-build
  allow_failure: true
  rules:
   - if: '$RUN_UBSAN == "true"'
     when: never
   - if: '$RUN_COVERAGE == "true"'
     when: never
   - when: on_success
