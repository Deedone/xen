.test-jobs-common:
  stage: test
  image: xentroops/xen_rel
  rules:
  - when: on_success

.arm64-zephyr-test-needs: &arm64-zephyr-test-needs
  - xen-atfe-arm64

.qemu-arm64:
  extends: .test-jobs-common
  variables:
    LOGFILE: qemu-smoke-arm64.log
  artifacts:
    paths:
      - '*.serial'
      - '*.log'
      - 'coverage_data'
      - 'binaries/*.bin'
      - 'binaries/*.dtb'
    when: always
  tags:
    - aws-arm64

# Test jobs

qemu-zephyr-tests:
  extends: .qemu-arm64
  parallel:
    matrix:
      - TEST:
        # [XenValTestJob~~1->XenValTestCode~domctl_pausedomain_set~1]
        - "hyp-domctl-pausedomain"
        # [XenValTestJob~~1->XenValTestCode~domctl_unpausedomain_set~1]
        - "hyp-domctl-unpausedomain"
        # [XenValTestJob~~1->XenValTestCode~domctl_resumedomain_set~1]
        - "hyp-domctl-resumedomain"
        # [XenValTestJob~~1->XenValTestCode~domctl_max_vcpus_set~1]
        - "hyp-domctl-max-vcpus"
        # [XenValTestJob~~1->XenValTestCode~domctl_setvcpucontext_set~1]
        - "hyp-domctl-setvcpucontext"
        # [XenValTestJob~~1->XenValTestCode~domctl_getvcpucontext_get~1]
        - "hyp-domctl-getvcpucontext"
        # [XenValTestJob~~1->XenValTestCode~domctl_bind_pt_irq~1]
        - "hyp-domctl-bind-pt-irq"
        # [XenValTestJob~~1->XenValTestCode~domctl_deassign_device_set~1]
        - "hyp-domctl-deassign-device"
  script:
    - ./automation/renesas-scripts/qemu-zephyr.sh ${TEST} 2>&1 | tee ${LOGFILE}
  needs:
    - *arm64-zephyr-test-needs
