    # [XenValTestJob~~1->XenValTestCode~arm64_domctl_get_paging_mempool_size~1]
    - "hyp-domctl-get-paging-mempool-size"
    # [XenValTestJob~~1->XenValTestCode~arm64_domctl_set_paging_mempool_size~1]
