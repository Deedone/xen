# --- minerva-* pure-runtime variants for smoke tests (Series 11) ---
# These extend a smoke-flavoured .minerva-smoke-arm64 template that
# runs the same workload as the plain qemu-smoke-* job and emits
# runtime-artifacts/<test>/ via package_artifacts.sh. No static
# analysis here; the corpus job matches these to the
# minerva-static-analysis artifact by manifest identity.
.minerva-smoke-arm64:
  extends: .qemu-arm64
  when: manual
  variables:
    MINERVA_GIT_SHA: "$CI_COMMIT_SHA"
    MINERVA_TARGET_ARCH: "arm64"
    MINERVA_CONFIG_NAME: "rel_arm64_defconfig+debug-info"
    MINERVA_CONFIG_FILE: ".config"
    MINERVA_RUNTIME_LOG_DIR: "$CI_PROJECT_DIR"
  after_script:
    - bash automation/renesas-scripts/minerva/package_artifacts.sh
        runtime . runtime-artifacts "$CI_JOB_NAME"
  needs:
    - *arm64-test-needs
    - xen-atfe-arm64-minerva
  artifacts:
    paths:
      - runtime-artifacts/
      - '*.log'
      - '*.serial'
    when: always

minerva-qemu-smoke-dom0-arm64-gcc:
  extends: .minerva-smoke-arm64
  script:
    - ./automation/renesas-scripts/qemu-smoke-dom0-arm64.sh 2>&1 | tee ${LOGFILE}

minerva-qemu-smoke-dom0-arm64-gcc-debug:
