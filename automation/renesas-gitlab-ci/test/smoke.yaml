.test-jobs-common:
  stage: test
  image: xentroops/xen_rel
  rules:
  - when: on_success

.arm64-test-needs: &arm64-test-needs
  - linux-6.6.86-image-export
  - alpine-3.18-rootfs-export
  - alpine-3.18-xen-tools-export
  - xen-atfe-arm64

.qemu-arm64:
  extends: .test-jobs-common
  variables:
    LOGFILE: qemu-smoke-arm64.log
  artifacts:
    paths:
      - '*.serial'
      - '*.log'
    when: always
  tags:
    - aws-arm64

# Test jobs
qemu-smoke-dom0-arm64-gcc:
  extends: .qemu-arm64
  script:
    - ./automation/renesas-scripts/qemu-smoke-dom0-arm64.sh 2>&1 | tee ${LOGFILE}
  needs:
    - *arm64-test-needs

