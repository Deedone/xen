.test-jobs-common:
  stage: test
  image: xentroops/xen_rel
  rules:
  - when: on_success

.qemu-arm64:
  extends: .test-jobs-common
  variables:
    LOGFILE: qemu-smoke-arm64.log
  artifacts:
    paths:
      - '*.serial'
      - '*.log'
      - 'coverage_data'
      - 'coverage_mcdc'
    when: always
  tags:
    - aws-arm64

# Test jobs

.lldb-test-matrix: &lldb-test-matrix
  - TEST_SCRIPT:
    - "sched_core_scheduler_init.py"
    - "sched_core_scheduler_init_cpu_sched_up_fail.py"
    - "sched_core_scheduler_init_domain_create_fail.py"
    - "sched_core_scheduler_init_get_by_name_default_fail.py"
    - "sched_core_scheduler_init_global_init_fail.py"
    - "sched_core_scheduler_init_nr_cpu_ids_fail.py"
    - "sched_core_scheduler_init_sched_init_fail.py"
    - "sched_core_scheduler_init_sched_ratelimit_max.py"
    - "sched_core_scheduler_init_sched_ratelimit_min.py"
    - "sched_core_scheduler_init_test_func_fail.py"
    - "sched_core_scheduler_init_vcpu_create_fail.py"

qemu-lldb-tests:
  extends: .qemu-arm64
  variables:
    USE_TFA: "true"
  parallel:
    matrix: *lldb-test-matrix
  script:
    - ./automation/renesas-scripts/qemu-lldb.sh "${TEST_SCRIPT}"
  needs:
    - xen-atfe-arm64
    - tf-a-qemu

qemu-lldb-mcdc:
  extends: .qemu-arm64
  variables:
    MCDC_CONF: "${CI_PROJECT_DIR}/binaries/plugin.conf"
    MCDC_PLUGIN: "${CI_PROJECT_DIR}/binaries/libbrtrace.so"
    MCDC_DWARF: "${CI_PROJECT_DIR}/binaries/xen-dwarf.pickle"
    MCDC_TOOL_DIR: "${CI_PROJECT_DIR}/clang-qemu-mcdc"
    RUN_COVERAGE: "true"
    USE_TFA: "true"
  parallel:
    matrix: *lldb-test-matrix
  rules:
    - if: '$RUN_UBSAN == "true"'
      when: never
    - when: on_success
  script:
    - git clone --depth 1 -b "${MCDC_TOOL_BRANCH}" "${MCDC_TOOL_URI}" clang-qemu-mcdc
    - ./automation/renesas-scripts/qemu-lldb.sh "${TEST_SCRIPT}"
  needs:
    - xen-mcdc-arm64
    - mcdc-qemu-plugin
    - tf-a-qemu
