.test-jobs-common:
  stage: test
  image: xentroops/xen_rel
  rules:
  - when: on_success

.arm64-xtf-test-needs: &arm64-xtf-test-needs
  - xen-atfe-arm64
  - linux-6.6.86-image-export
  - alpine-3.18-xen-tools-export

.qemu-arm64:
  extends: .test-jobs-common
  variables:
    LOGFILE: qemu-smoke-arm64.log
  artifacts:
    paths:
      - '*.serial'
      - '*.log'
    when: always
  tags:
    - aws-arm64

# Test jobs

# Tests for scheduler_init()
qemu-lldb-sched-init-success:
  extends: .qemu-arm64
  script:
    - ./automation/renesas-scripts/qemu-lldb.sh sched_core_scheduler_init.py 2>&1 | tee ${LOGFILE}
  needs:
    - *arm64-xtf-test-needs

