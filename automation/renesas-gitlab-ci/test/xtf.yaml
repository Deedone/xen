.test-jobs-common:
  stage: test
  image: xentroops/xen_rel
  rules:
  - when: on_success

.arm64-xtf-test-needs: &arm64-xtf-test-needs
  - xen-atfe-arm64
  - linux-6.6.86-image-export
  - alpine-3.18-xen-tools-export

.qemu-arm64:
  extends: .test-jobs-common
  variables:
    LOGFILE: qemu-smoke-arm64.log
  artifacts:
    paths:
      - '*.serial'
      - '*.log'
      - 'coverage_data'
    when: always
  tags:
    - aws-arm64

.minerva-arm64:
  extends: .qemu-arm64
  when: manual
  variables:
    XEN_DEFCONFIG: "rel_arm64_defconfig"
    MINERVA_CALLGRAPH_BACKEND: "llvm-ir"
    MINERVA_GENERATE_LLVM_IR: "true"
    LLVM_CC: "clang"
    MINERVA_RUNTIME_COMMAND: "true"
    MINERVA_RUNTIME_LOG_DIR: "indirect-reachability/runtime"
    MINERVA_RUNTIME_REQUIRED: "false"
    MINERVA_RUNTIME_TIMEOUT: "600"
  after_script:
    - mkdir -p indirect-reachability/runtime
    - cp ${LOGFILE} indirect-reachability/runtime
    - bash automation/renesas-scripts/minerva/run_indirect_ci.sh
  needs:
    - *arm64-xtf-test-needs
    - xen-atfe-arm64-minerva
  artifacts:
    paths:
      - indirect-reachability/
    when: always

# Test jobs

# XTF is run in dom0

qemu-xtf-tests:
  extends: .qemu-arm64
  parallel:
    matrix:
      - TEST:
        - "arm64 mmu64le hyp-xen-version"
        # [XenValTestJob~~1->XenValTestCode~arm64_sysctl_physinfo_host~1]
        - "arm64 mmu64le hyp-sysctl-physinfo"
        # [XenValTestJob~~1->XenValTestCode~arm64_domctl_cacheflush~1]
        - "arm64 mmu64le hyp-domctl-cacheflush"
        # [XenValTestJob~~1->XenValTestCode~domctl_destroy_domain_using_domctl~1]
        - "arm64 mmu64le hyp-domctl-destroydomain"
        - "arm64 mmu64le hyp-domctl-pausedomain"
        # [XenValTestJob~~1->XenValTestCode~arm64_domctl_set_paging_mempool_size~1]
        - "arm64 mmu64le hyp-domctl-set-paging-mempool-size"
        - "arm64 mmu64le hyp-domctl-unpausedomain"
        # [XenValTestJob~~1->XenValTestCode~sysctl_get_vmlist_using_sysctl~1]
        - "arm64 mmu64le hyp-sysctl-getdomaininfolist"
        # [XenValTestJob~~1->XenValTestCode~arm64_domctl_getdomaininfo_domain~1]
        - "arm64 mmu64le hyp-domctl-getdomaininfo"
        # [XenValTestJob~~1->XenValTestCode~arm64_domctl_createdomain~1]
        - "arm64 mmu64le hyp-domctl-createdomain"
        # [XenValTestJob~~1->XenValTestCode~arm64_domctl_get_paging_mempool_size~1]
        - "arm64 mmu64le hyp-domctl-get-paging-mempool-size"
        # [XenValTestJob~~1->XenValTestCode~domctl_max_mem~1]
        - "arm64 mmu64le hyp-domctl-max-mem"
        # [XenValTestJob~arm64_use_rtds_sched_if_selected_via_xen_cmd_line~1]
        - "arm64 mmu64le hyp-sysctl-sched-rtds-cmdline"
        # [XenValTestJob~arm64_use_rtds_sched_if_set_in_boot_time_cpupool~1]
        - "arm64 mmu64le hyp-sysctl-sched-rtds-boot-cpupool"
        # [XenValTestJob~arm64_use_rtds_sched_if_set_via_hypercall~1]
        - "arm64 mmu64le hyp-sysctl-sched-rtds-create-cpupool"
        - "arm64 mmu64le hyp-sysctl-sched-rtds-edf"
        - "arm64 mmu64le hyp-sysctl-sched-rtds-extratime"
        # [XenValTestJob~~1->XenValTestCode~rtds_sched_configure_params_per_vcpu~1]
        - "arm64 mmu64le hyp-domctl-sched-rtds-params"
        # [XenValTestJob~~1->XenValTestCode~rtds_sched_tickle_pcpus~1]
        - "arm64 mmu64le hyp-sysctl-sched-rtds-tickle"
      # Extra domain-wide variant for the same test
      - TEST:
          # [XenValTestJob~~1->XenValTestCode~rtds_sched_configure_params_per_domain~1]
          - "arm64 mmu64le hyp-domctl-sched-rtds-params"
        EXTRA_XTF_MAKE_VARS:
          - "EXTRA_FLAGS=-DTEST_DOMAIN_WIDE"
  script:
    - ./automation/renesas-scripts/qemu-xtf.sh ${TEST} 2>&1 | tee ${LOGFILE}
  needs:
    - *arm64-xtf-test-needs

