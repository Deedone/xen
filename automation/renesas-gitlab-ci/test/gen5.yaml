# ---------------------------------------------------------------------------
# Gen5 board selector (build stage)
# Probes the Gen5 boards, recovers any that are wedged (two-tier, guarded PDU
# escalation), and emits BOARD_ID via a dotenv artifact for the HW test jobs to
# inherit. Runs in the build stage (needs no build artifacts) so its
# probe/recover latency overlaps the builds and the cloud QEMU jobs.
# See automation/renesas-scripts/gen5-board-select.sh for details.
# ---------------------------------------------------------------------------
gen5-board-select:
  stage: build
  rules:
    - when: on_success
  variables:
    # Candidate pool. Pin to a single board (e.g. "2") if one is known dead.
    BOARDS: "1 2"
  script:
    - ./automation/renesas-scripts/gen5-board-select.sh
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - '*.serial'
    when: always
  tags:
    - epdefrans

# ---------------------------------------------------------------------------
# Gen5 hardware test template
# Runs on etest (EPDEFRASD0001) via the 'epdefrans' shell executor.
# See automation/renesas-scripts/gen5-zephyr.sh for details.
# ---------------------------------------------------------------------------
.gen5-zephyr:
  extends: .test-jobs-common
  # BOARD_ID is inherited from the gen5-board-select dotenv artifact (a healthy
  # board chosen per pipeline). resource_group serializes every gen5 job so
  # concurrent jobs never contend for the same board / console.
  resource_group: gen5-ironhide
  variables:
    LOGFILE: hw-zephyr-arm64.log
  artifacts:
    paths:
      - '*.serial'
      - '*.log'
    when: always
  tags:
    - epdefrans

# Gen5 hardware Zephyr test jobs. One matrix instance per test; each copies its
# uniquely named Dom0 image (dom0-<name>.bin, from the zephyr-gen5-build matrix)
# into place before the runner picks it up as binaries/dom0.bin.
gen5-zephyr-tests:
  extends: .gen5-zephyr
  parallel:
    matrix:
      - TEST:
          # [XenValTestJob~~1->XenValTestCode~domctl_pausedomain_set~1]
          - hyp-domctl-pausedomain
          # [XenValTestJob~~1->XenValTestCode~domctl_unpausedomain_set~1]
          - hyp-domctl-unpausedomain
          # [XenValTestJob~~1->XenValTestCode~domctl_resumedomain_set~1]
          - hyp-domctl-resumedomain
          # [XenValTestJob~~1->XenValTestCode~domctl_getvcpucontext_get~1]
          - hyp-domctl-getvcpucontext
          # [XenValTestJob~~1->XenValTestCode~domctl_setvcpucontext_set~1]
          - hyp-domctl-setvcpucontext
          # [XenValTestJob~~1->XenValTestCode~domctl_max_vcpus_set~1]
          - hyp-domctl-max-vcpus
  script:
    - cp "binaries/dom0-${TEST}.bin" binaries/dom0.bin
    # Hold the bench lock SHARED so gen5-board-select's bench-wide PDU recovery
    # (exclusive, non-blocking) can never cold-cycle the bench mid-test.
    - mkdir -p /tmp/gen5-bench-state
    - flock -s /tmp/gen5-bench-state/bench.lock ./automation/renesas-scripts/gen5-zephyr.sh ${TEST} 2>&1 | tee ${LOGFILE}
  needs:
    - job: gen5-board-select
      artifacts: true
    - xen-atfe-arm64
    - zephyr-gen5-build
