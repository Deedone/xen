.arm64-build-tmpl:
  stage: build
  image: xentroops/xen_rel
  variables:
    HYPERVISOR_ONLY: y
    XEN_TARGET_ARCH: arm64
    KBUILD_DEFCONFIG: rel_arm64_defconfig
    BASE_XEN_CONFIG: |
      CONFIG_CMDLINE="xsm=flask flask=permissive"
      CONFIG_DEBUG_INFO=y
    CUSTOM_XEN_CONFIG: ""
  before_script:
    - |
      UBSAN_CONFIG=""
      COVERAGE_CONFIG=""

      if [ "$RUN_UBSAN" == "true" ]; then
        UBSAN_CONFIG=$'CONFIG_UBSAN=y\nCONFIG_UBSAN_FATAL=y'
      fi

      if [ "$RUN_COVERAGE" == "true" ]; then
        COVERAGE_CONFIG="CONFIG_NO_OPTIMIZE=y"
      fi

      EXTRA_XEN_CONFIG="${BASE_XEN_CONFIG}"$'\n'
      EXTRA_XEN_CONFIG+="${UBSAN_CONFIG}"$'\n'
      EXTRA_XEN_CONFIG+="${COVERAGE_CONFIG}"$'\n'
      EXTRA_XEN_CONFIG+="${CUSTOM_XEN_CONFIG}"

      export EXTRA_XEN_CONFIG
  script:
    - mkdir -p binaries
    - ./automation/renesas-scripts/build 2>&1 | tee build.log
  artifacts:
    paths:
      - binaries/xen
      - binaries/xen-syms
      - intermediates/
      - xen-config
      - '*.log'
      - '*/*.log'
    when: always
  needs: []
  rules:
    - if: '$RUN_UBSAN == "true"'
      variables:
        UBSAN_CONFIG: |
          CONFIG_UBSAN=y
          CONFIG_UBSAN_FATAL=y
    - if: '$RUN_COVERAGE == "true"'
      variables:
        COVERAGE_CONFIG: |
          CONFIG_NO_OPTIMIZE=y
    - when: always
  tags:
    - aws-arm64

.gcc-tmpl:
  variables: &gcc
    CC: gcc
    CXX: g++

.clang-tmpl:
  variables: &clang
    CC: clang
    CXX: clang++
    HOSTCC: gcc
    HOSTCXX: g++
    clang: y
    llvm: y

.arm64-build:
  extends: .arm64-build-tmpl
  variables:
    debug: n

.arm64-build-debug:
  extends: .arm64-build-tmpl
  variables:
    debug: y

.gcc-arm64-build:
  extends: .arm64-build
  variables:
    <<: *gcc

.gcc-arm64-build-debug:
  extends: .arm64-build-debug
  variables:
    <<: *gcc

.atfe-arm64-build:
  extends: .arm64-build
  variables:
    <<: *clang

.atfe-arm64-build-debug:
  extends: .arm64-build-debug
  variables:
    <<: *clang

# Jobs below this line

# Build jobs needed for tests

# Arm builds

xen-atfe-arm64:
  extends: .atfe-arm64-build

xen-atfe-arm64-earlyprintk:
  extends: .atfe-arm64-build
  variables:
    CUSTOM_XEN_CONFIG: |
      CONFIG_EARLY_UART_CHOICE_PL011=y
      CONFIG_EARLY_UART_BASE_ADDRESS=0x9000000
  rules:
    - if: '$RUN_UBSAN == "true"'

# ---------------------------------------------------------------------------
# Zephyr Dom0 binaries for Gen5 hardware tests
# Built on aws-arm64 Docker (Zephyr SDK available); epdefrans has no SDK.
# Dom0 uses qemu_cortex_a53 board with xen_dom0 + xen_dom0_overlay snippets
# and xen_dom0_overlay_gen5_ironhide for Gen5 grant table / extended region
# addresses. Snippet defined in zephyr_tests/testcases/snippets/. One matrix
# instance per test - each exports a uniquely named binaries/dom0-<name>.bin.
# ---------------------------------------------------------------------------

zephyr-gen5-build:
  stage: build
  image: xentroops/xen_rel
  tags:
    - aws-arm64
  needs: []
  parallel:
    matrix:
      - ZEPHYR_TEST_NAME:
          - hyp-domctl-pausedomain
          - hyp-domctl-unpausedomain
          - hyp-domctl-resumedomain
          - hyp-domctl-getvcpucontext
          - hyp-domctl-setvcpucontext
          - hyp-domctl-max-vcpus
  script:
    - mkdir -p binaries
    - git clone --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitpct.epam.com/rec-fusa/zephyr_tests.git" -b safety-staging zephyr_tests
    - cd "${ZEPHYR_SDK_INSTALL_DIR}"
    - west build -p always -b xenvm "${CI_PROJECT_DIR}/zephyr_tests/testcases/domu-basic"
    - cp build/zephyr/zephyr.bin "${CI_PROJECT_DIR}/binaries/domu-basic.bin"
    - cp build/domu-basic.dtb "${CI_PROJECT_DIR}/binaries/domu-basic.dtb"
    - export PREBUILT_IMAGES="${CI_PROJECT_DIR}/binaries"
    - west build -p always -b qemu_cortex_a53 -S xen_dom0 -S xen_dom0_overlay_gen5_ironhide "${CI_PROJECT_DIR}/zephyr_tests/testcases/${ZEPHYR_TEST_NAME}"
    - cp build/zephyr/zephyr.bin "${CI_PROJECT_DIR}/binaries/dom0-${ZEPHYR_TEST_NAME}.bin"
    # Patch the arm64 boot-header image_size field (offset 0x10) to the real
    # .bin size so Xen's zImage loader copies the whole dom0. With CONFIG_XIP=n
    # there is no separate flash region, so Zephyr's _flash_used symbol (which
    # feeds image_size) ends up as an absolute link address instead of a size
    # (e.g. 0x40278000 for a 74000-byte image); without this Xen would copy ~1 GB.
    - python3 -c "import struct,os; f=open('${CI_PROJECT_DIR}/binaries/dom0-${ZEPHYR_TEST_NAME}.bin','r+b'); sz=os.path.getsize('${CI_PROJECT_DIR}/binaries/dom0-${ZEPHYR_TEST_NAME}.bin'); f.seek(16); f.write(struct.pack('<Q',sz)); print(f'dom0.bin image_size patched to {sz} bytes')"
  artifacts:
    paths:
      - binaries/dom0-${ZEPHYR_TEST_NAME}.bin
    when: always
