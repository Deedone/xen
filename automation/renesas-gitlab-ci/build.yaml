.build-tmpl: &build
  stage: build
  image: xentroops/xen_rel
  script:
    - mkdir -p binaries
    - ./automation/renesas-scripts/build 2>&1 | tee build.log
  artifacts:
    paths:
      - binaries/xen
      - binaries/xen-syms
      - xen-config
      - '*.log'
      - '*/*.log'
    when: always
  needs: []
  rules:
  - when: always

.gcc-tmpl:
  variables: &gcc
    CC: gcc
    CXX: g++

.clang-tmpl:
  variables: &clang
    CC: clang
    CXX: clang++
    HOSTCC: gcc
    HOSTCXX: g++
    clang: y
    llvm: y

.arm64-build-tmpl:
  <<: *build
  variables:
    XEN_TARGET_ARCH: arm64
  tags:
    - aws-arm64

.arm64-build:
  extends: .arm64-build-tmpl
  variables:
    debug: n

.arm64-build-debug:
  extends: .arm64-build-tmpl
  variables:
    debug: y

.gcc-arm64-build:
  extends: .arm64-build
  variables:
    <<: *gcc

.gcc-arm64-build-debug:
  extends: .arm64-build-debug
  variables:
    <<: *gcc

.atfe-arm64-build:
  extends: .arm64-build
  variables:
    <<: *clang

.atfe-arm64-build-debug:
  extends: .arm64-build-debug
  variables:
    <<: *clang

# Jobs below this line

# Build jobs needed for tests

# Arm builds

xen-atfe-arm64:
  extends: .atfe-arm64-build
  variables:
    HYPERVISOR_ONLY: y
    KBUILD_DEFCONFIG: rel_arm64_defconfig
    EXTRA_XEN_CONFIG: |
      CONFIG_CMDLINE="xsm=flask flask=permissive"
      CONFIG_DEBUG_INFO=y

xen-atfe-arm64-earlyprintk:
  extends: .atfe-arm64-build
  variables:
    HYPERVISOR_ONLY: y
    KBUILD_DEFCONFIG: rel_arm64_defconfig
    EXTRA_XEN_CONFIG: |
      CONFIG_EARLY_UART_CHOICE_PL011=y
      CONFIG_EARLY_UART_BASE_ADDRESS=0x9000000
      CONFIG_CMDLINE="xsm=flask flask=permissive"
