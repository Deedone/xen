# Linux kernel
linux-6.6.86-image-export:
  stage: artifacts
  image: xentroops/xen_artifacts_rel
  script:
    - mkdir -p binaries
    - cp /artifacts/Image binaries/Image
  artifacts:
    paths:
      - binaries/
  tags:
    - aws-arm64
  needs: []

# Root FS
alpine-3.18-rootfs-export:
  stage: artifacts
  image: xentroops/xen_artifacts_rel
  script:
    - mkdir -p binaries
    - cp /artifacts/rootfs.cpio.gz binaries/rootfs.cpio.gz
  artifacts:
    paths:
      - binaries/
  tags:
    - aws-arm64
  needs: []

# DomU arm64 busybox initrd for Gen5 hardware XTF tests
# Built on aws-arm64 where /bin/busybox is arm64; epdefrans runner is x86-64.
arm64-busybox-initrd-export:
  stage: artifacts
  image: xentroops/xen_rel
  script:
    - mkdir -p binaries/initrd/bin binaries/initrd/sbin binaries/initrd/etc
        binaries/initrd/dev binaries/initrd/proc binaries/initrd/sys
        binaries/initrd/lib binaries/initrd/var binaries/initrd/mnt
    - cp /bin/busybox binaries/initrd/bin/busybox
    - binaries/initrd/bin/busybox --install binaries/initrd/bin
    - |
      printf '#!/bin/sh\nmount -t proc proc /proc\nmount -t sysfs sysfs /sys\nmount -t devtmpfs devtmpfs /dev\n/bin/sh\n' > binaries/initrd/init
    - chmod +x binaries/initrd/init
    - (cd binaries/initrd && find . | cpio -H newc -o | gzip > ../domU-rootfs.cpio.gz)
  artifacts:
    paths:
      - binaries/domU-rootfs.cpio.gz
  tags:
    - aws-arm64
  needs: []

# Xen Tools
alpine-3.18-xen-tools-export:
  stage: artifacts
  image: registry.gitlab.com/xen-project/xen/alpine:3.18-arm64v8
  script:
    - mkdir -p binaries
    - ./automation/renesas-scripts/build 2>&1 | tee build.log
  artifacts:
    paths:
      - binaries/xen-tools.cpio.gz
  tags:
    - aws-arm64
  needs: []
  variables:
    CC: gcc
    CXX: g++
    XEN_TARGET_ARCH: arm64
    debug: n
    TOOLS_ONLY: y