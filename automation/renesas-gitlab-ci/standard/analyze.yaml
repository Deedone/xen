gen_coverage_report:
  stage: analyze
  tags:
    - aws-arm64
  image: xentroops/xen_rel
  script:
    - LCOV_ARGS=$(find ./coverage_data -name "*.info" -printf "-a %p "); lcov --rc lcov_branch_coverage=1 $LCOV_ARGS -o coverage.info
    - genhtml --substitute 's|arch/arm/efi/common-stub.c|common/efi/common-stub.c|g' -o coverage-report coverage.info
    - tar -czf coverage-report.tar.gz coverage-report
  coverage: '/^\s*lines\.+:\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - 'coverage.info'
      - 'coverage-report.tar.gz'
  dependencies:
    - qemu-lldb-mcdc
    - qemu-zephyr-mcdc
  rules:
    - when: always

gen_mcdc_report:
  stage: analyze
  tags:
    - aws-arm64
  variables:
    MCDC_DWARF: "${CI_PROJECT_DIR}/binaries/xen-dwarf.pickle"
    MCDC_TOOL_DIR: "${CI_PROJECT_DIR}/clang-qemu-mcdc"
  dependencies:
    - xen-mcdc-arm64
    - qemu-zephyr-mcdc
    - qemu-lldb-mcdc
  image: xentroops/xen_rel
  script:
    - git clone --depth 1 -b "${MCDC_TOOL_BRANCH}" "${MCDC_TOOL_URI}" clang-qemu-mcdc
    - mkdir -p traces/
    - find ./coverage_mcdc -name '*-traces.tar.gz' -exec tar -xzf {} -C traces \;
    - QEMU_TRACES=$(find ./traces -name "*brtrace.dat" -print )
    - ./automation/renesas-scripts/mcdc-report.sh $QEMU_TRACES
  coverage: '/^\s*MC\/DCs\.+:\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - 'coverage_mcdc/combined_report/'
    exclude:
      - 'coverage_mcdc/combined_report/*-traces.tar.gz'
    when: always
  rules:
    - when: always
