# Root FS
alpine-3.18-arm64-rootfs:
  stage: build
  image: registry.gitlab.com/xen-project/hardware/test-artifacts/alpine:3.18-arm64-base
  script:
    - mkdir -p binaries
    - ./automation/renesas-artifacts/scripts/alpine-rootfs.sh
  artifacts:
    paths:
      - binaries/
  tags:
    - arm64

# Linux kernel
linux-6.6.86-arm64:
  stage: build
  image: registry.gitlab.com/xen-project/hardware/test-artifacts/alpine:3.18-arm64-build
  script:
    - mkdir -p binaries
    - ./automation/renesas-artifacts/scripts/build-linux.sh
  artifacts:
    paths:
      - binaries/
  variables:
    LINUX_VERSION: 6.6.86
  tags:
    - arm64
